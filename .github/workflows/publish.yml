name: Publish

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  test:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  publish:
    name: Build & Publish ${{ matrix.image }} Image
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: app
            image: nibble
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "${GITHUB_REF_NAME} points to a commit that is not on main" >&2
            exit 1
          fi

      - name: Resolve current tag
        id: tags
        run: |
          CURRENT_TAG="${GITHUB_REF_NAME}"
          NO_V="${CURRENT_TAG#v}"
          MAJOR_MINOR="${NO_V%.*}"
          {
            echo "current=${CURRENT_TAG}"
            echo "current_no_v=${NO_V}"
            echo "current_major_minor=v${MAJOR_MINOR}"
            echo "current_major_minor_no_v=${MAJOR_MINOR}"
          } >> "$GITHUB_OUTPUT"

      - name: Normalize registry owner
        id: owner
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          target: ${{ matrix.target }}
          push: true
          platforms: linux/amd64
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/${{ matrix.image }}:${{ steps.tags.outputs.current }}
            ghcr.io/${{ steps.owner.outputs.name }}/${{ matrix.image }}:${{ steps.tags.outputs.current_no_v }}
            ghcr.io/${{ steps.owner.outputs.name }}/${{ matrix.image }}:${{ steps.tags.outputs.current_major_minor }}
            ghcr.io/${{ steps.owner.outputs.name }}/${{ matrix.image }}:${{ steps.tags.outputs.current_major_minor_no_v }}
            ghcr.io/${{ steps.owner.outputs.name }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  publish-sdk:
    name: Publish SDK
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check SDK changes
        id: changes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PATCH="$(echo "${VERSION}" | cut -d. -f3)"
          PREVIOUS_TAG="$(git describe --tags --abbrev=0 --match 'v*.*.*' --exclude '*-*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          PREVIOUS_VERSION="${PREVIOUS_TAG#v}"
          # X.Y.0 and prereleases always publish, so ~X.Y.0 resolves even when later patches skip.
          if [[ "${PATCH}" != "0" && "${PATCH}" != *-* && -n "${PREVIOUS_TAG}" ]] \
            && [[ "$(echo "${VERSION}" | cut -d. -f1,2)" == "$(echo "${PREVIOUS_VERSION}" | cut -d. -f1,2)" ]] \
            && git diff --quiet "${PREVIOUS_TAG}" "${GITHUB_SHA}" -- nibble-sdk/src; then
            echo "nibble-sdk/src is unchanged since ${PREVIOUS_TAG}, skipping publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Bun
        if: steps.changes.outputs.skip != 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        if: steps.changes.outputs.skip != 'true'
        run: bun install --frozen-lockfile

      - name: Build SDK
        if: steps.changes.outputs.skip != 'true'
        env:
          NIBBLE_VERSION: ${{ github.ref_name }}
        run: bun run build:sdk

      - name: Set up Node
        if: steps.changes.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Publish to npm
        if: steps.changes.outputs.skip != 'true'
        working-directory: nibble-sdk/dist
        run: |
          # npm puts every publish on the latest dist-tag unless told otherwise, prereleases included.
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            npm publish --access public --tag next
          else
            npm publish --access public
          fi
